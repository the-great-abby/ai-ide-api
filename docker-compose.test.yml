services:
  db-test:
    build:
      context: .
      dockerfile: Dockerfile.pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: memorydb,rulesdb
    ports:
      - "5433:5432"
    volumes:
      - rules_postgres_data_test:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  test:
    build:
      context: .
      dockerfile: Dockerfile.tests
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - ENVIRONMENT=test
      - POSTGRES_DB=rulesdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=db-test
      - POSTGRES_PORT=5432
      - DATABASE_URL=postgresql://postgres:postgres@db-test:5432/rulesdb
      - MEMORY_DATABASE_URL=postgresql://postgres:postgres@db-test:5432/memorydb
    depends_on:
      db-test:
        condition: service_healthy
    command: ["./docker/initdb/wait-for-it.sh", "db-test", "pytest", "tests/"]

  coverage:
    build: .
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    command: ["pytest", "--cov=rule_api_server", "--cov-report=term-missing", "test_rule_api_server.py"]

  frontend:
    build:
      context: ./admin-frontend
      args:
        VITE_API_BASE_URL: "http://localhost:9103"
    ports:
      - "3001:80"
    depends_on:
      - test
    environment:
      - VITE_API_BASE_URL=http://localhost:9103

  playwright:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile.playwright
    working_dir: /app
    depends_on:
      - frontend
    command: ["npx", "playwright", "test"]
    environment:
      - CI=true

  misc-scripts:
    build:
      context: .
      dockerfile: Dockerfile.misc-scripts
    volumes:
      - ./misc_scripts:/scripts
      - ./.cursor/rules:/app/.cursor/rules
      - ./ai_ide_rules:/app/ai_ide_rules
      - .:/code
      - ./.git:/code/.git
    working_dir: /scripts
    depends_on:
      - test
    environment:
      - RUNNING_IN_DOCKER=1
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - PGHOST=db-test
      - PGPORT=5432
      - MEMORY_API_URL=http://test:8000/memory/nodes
      - OLLAMA_URL=http://host.docker.internal:11434/api/generate
      - OLLAMA_MODEL=llama3.1:8b-instruct-q6_K
    command: tail -f /dev/null

  ollama-functions:
    build:
      context: .
      dockerfile: Dockerfile.ollama_functions
    environment:
      - RUNNING_IN_DOCKER=1
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434/api/generate}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3:8b}
    depends_on:
      - test
    volumes:
      - .:/code

  worker:
    build: ./worker
    environment:
      - RABBITMQ_URL=amqp://user:password@rabbitmq:5672/
      - OLLAMA_FUNCTIONS_URL=http://ollama-functions:8000
    depends_on:
      - ollama-functions

volumes:
  rules_postgres_data_test: 