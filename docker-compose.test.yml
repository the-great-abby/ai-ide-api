services:
  test-db:
    build:
      context: .
      dockerfile: Dockerfile.pgvector
    container_name: test-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: memorydb,rulesdb
    ports:
      - "5433:5432"
    volumes:
      - ${TEST_DB_VOLUME:-rules_postgres_data_test_fresh}:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles: ["test"]

  test:
    build: .
    volumes:
      - .:/app
      - ./scripts:/scripts
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - POSTGRES_DB=rulesdb
      - POSTGRES_HOST=test-db
      - POSTGRES_USER=postgres
      - DATABASE_URL=postgresql://postgres:postgres@test-db:5432/rulesdb
      - OLLAMA_FUNCTIONS_URL=http://test-ollama-functions:8000
      - CORS_ORIGINS=*
      - RABBITMQ_URL=amqp://user:password@test-rabbitmq:5672/
      - ENVIRONMENT=test
    depends_on:
      test-db:
        condition: service_healthy
    command: ["./scripts/wait-for-it.sh", "test-db", "pytest", "tests/"]
    env_file:
      - .env.test
    profiles: ["test"]

  coverage:
    build: .
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    command: ["pytest", "--cov=rule_api_server", "--cov-report=term-missing", "test_rule_api_server.py"]
    profiles: ["test"]

  test-frontend:
    build:
      context: ./admin-frontend
      args:
        VITE_API_BASE_URL: "http://test-api:8000"
    ports:
      - "3001:80"
    depends_on:
      - test
    environment:
      - VITE_API_BASE_URL=http://test-api:8000
    profiles: ["test"]

  playwright:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile.playwright
    working_dir: /app
    depends_on:
      - test-frontend
    command: ["npx", "playwright", "test"]
    environment:
      - CI=true
    profiles: ["test"]

  test-misc-scripts:
    build:
      context: .
      dockerfile: Dockerfile.misc-scripts
    volumes:
      - ./misc_scripts:/scripts
      - ./.cursor/rules:/app/.cursor/rules
      - ./ai_ide_rules:/app/ai_ide_rules
      - .:/code
      - ./.git:/code/.git
    working_dir: /scripts
    depends_on:
      - test
    environment:
      - RUNNING_IN_DOCKER=1
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - PGHOST=test-db
      - PGPORT=5432
      - MEMORY_API_URL=http://test-api:8000/memory/nodes
      - OLLAMA_URL=http://host.docker.internal:11434/api/generate
      - OLLAMA_MODEL=llama3.1:8b-instruct-q6_K
    command: tail -f /dev/null
    healthcheck:
      test: ["CMD", "python", "/scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles: ["test"]

  test-ollama-functions:
    build:
      context: .
      dockerfile: Dockerfile.ollama_functions
    environment:
      - RUNNING_IN_DOCKER=1
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434/api/generate}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3:8b}
    depends_on:
      - test
    volumes:
      - .:/code
    # env_file:
    #   - change-this-env.ollama-functions-test.example  # Uncomment if you want to template test-ollama-functions env
    profiles: ["llm-test"]

  test-worker:
    build: ./worker
    environment:
      - RABBITMQ_URL=amqp://user:password@rabbitmq:5672/
      - OLLAMA_FUNCTIONS_URL=http://test-ollama-functions:8000
    depends_on:
      - test-ollama-functions
    env_file:
      - .env.llm-worker-test
    volumes:
      - ./worker:/app
      - ./utils:/app/utils
      - ./.apitoken:/code/.apitoken
      - ./.git:/app/.git
    profiles: ["llm-test"]

  test-rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5673:5672"  # Host 5673 -> Container 5672 (internal)
      - "15673:15672" # Host 15673 -> Container 15672 (management UI)
    environment:
      - RABBITMQ_DEFAULT_USER=user
      - RABBITMQ_DEFAULT_PASS=password
    profiles: ["test", "llm-test"]

  test-api:
    build: .
    volumes:
      - .:/app
      - ./scripts:/scripts
    command: ["uvicorn", "rule_api_server:app", "--host", "0.0.0.0", "--reload"]
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - POSTGRES_DB=rulesdb
      - POSTGRES_HOST=test-db
      - DATABASE_URL=postgresql://postgres:postgres@test-db:5432/rulesdb
      - OLLAMA_FUNCTIONS_URL=http://test-ollama-functions:8000
      - CORS_ORIGINS=*
      - RABBITMQ_URL=amqp://user:password@test-rabbitmq:5672/
      - ENVIRONMENT=test
    ports:
      - "9104:8000"  # Host 9104 -> Container 8000
    depends_on:
      - test-db
      - test-rabbitmq
    # env_file:
    #   - change-this-env.api-test.example  # Uncomment if you want to template test-api env
    profiles: ["test"]

volumes: {}

networks:
  testnet: 