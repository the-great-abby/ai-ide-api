services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    profiles: ["dev", "llm"]  # Used in both dev and llm workflows

  api:
    build: .
    ports:
      - "${PORT:-9103}:8000"
    volumes:
      - .:/app
      - /app/usr/local/lib/python3.11/site-packages
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=rulesdb
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - MEMORY_POSTGRES_DB=memorydb
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/rulesdb
      - OLLAMA_FUNCTIONS_URL=http://ollama-functions:8000
      - CORS_ORIGINS=*  # Allow all origins for debugging; restrict in production!
      - RABBITMQ_URL=amqp://user:password@rabbitmq:5672/
      - ENVIRONMENT=dev
    depends_on:
      - db
      - rabbitmq
    command: ["uvicorn", "rule_api_server:app", "--host", "0.0.0.0", "--reload"]
    env_file:
      - .env.dev
    profiles: ["dev"]

  frontend:
    build:
      context: ./admin-frontend
      args:
        VITE_API_BASE_URL: "http://localhost:${PORT:-9103}"
    ports:
      - "${ADMIN_FRONTEND_PORT:-3000}:80"
    depends_on:
      - api
    environment:
      - VITE_API_BASE_URL=http://localhost:${PORT:-9103}
    profiles: ["dev"]

  db:
    build:
      context: .
      dockerfile: Dockerfile.pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: memorydb,rulesdb
    ports:
      - "5432:5432"
    volumes:
      - ${DEV_DB_VOLUME:-rules_postgres_data}:/var/lib/postgresql/data  # Now dynamic like test
      - ./docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles: ["dev"]

  misc-scripts:
    build:
      context: .
      dockerfile: Dockerfile.misc-scripts
    volumes:
      - ./misc_scripts:/scripts
#      - ./.cursor/rules:/app/.cursor/rules
#      - ./ai_ide_rules:/app/ai_ide_rules
      - .:/code
      - ./.git:/code/.git
#      - ./.apitoken:/code/.apitoken
    working_dir: /scripts
    depends_on:
      - api
    environment:
      - RUNNING_IN_DOCKER=1
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - PGHOST=db
      - PGPORT=5432
      - MEMORY_API_URL=http://api:8000/memory
      - OLLAMA_URL=http://host.docker.internal:11434/api/generate
      - OLLAMA_MODEL=llama3.1:8b-instruct-q6_K
      - RABBITMQ_URL=amqp://user:password@rabbitmq:5672/
      - PYTHONPATH=/code
    command: tail -f /dev/null
    healthcheck:
      test: ["CMD", "python", "/scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles: ["dev"]

  ollama-functions:
    build:
      context: .
      dockerfile: Dockerfile.ollama_functions
    environment:
      - RUNNING_IN_DOCKER=1
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434/api/generate}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3:8b}
    depends_on:
      - api
    volumes:
      - .:/code
    profiles: ["llm"]

  worker:

    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      - RUNNING_IN_DOCKER=1
      - RABBITMQ_URL=amqp://user:password@rabbitmq:5672/
      - OLLAMA_FUNCTIONS_URL=http://ollama-functions:8000
      - MEMORY_API_URL=http://api:8000/memory
      - MEMORY_API_TOKEN
      - PYTHONPATH=/app:/app/scripts:/code
    depends_on:
      - rabbitmq
      - ollama-functions
    env_file:
      - .env.llm-worker
    profiles: ["llm", "dev"]
    volumes:
      - ./worker:/app/worker
      - ./utils:/app/utils
      - ./scripts:/app/scripts
      - .:/code
      - ./.git:/code/.git
      - ./.apitoken:/code/.apitoken
      - ./.api_admin_token:/code/.api_admin_token
      - ./.git:/app/.git

  valkey:
    image: valkey/valkey:latest
    ports:
      - "6379:6379"
    profiles: ["dev", "llm"]

volumes:
  rules_postgres_data: 